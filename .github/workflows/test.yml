name: App checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: todo_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: todo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm --prefix frontend install --no-package-lock
      - run: npm --prefix frontend run build
      - run: python -m unittest test_app -v
        env:
          TEST_DATABASE_URL: postgresql://todo_test:disposable_test_password@localhost:5432/todo_test
